apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pokevault-mysql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: pokevault-mysql
spec:
  serviceName: pokevault-mysql
  replicas: 1
  selector:
    matchLabels:
      app: pokevault-mysql
  template:
    metadata:
      labels:
        app: pokevault-mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          args: ["--default-authentication-plugin=mysql_native_password"]
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pokevault-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "pokevault"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: pokevault-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pokevault-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.mysql.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: pokevault-mysql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: pokevault-mysql
spec:
  type: {{ .Values.mysql.service.type }}
  ports:
    - port: {{ .Values.mysql.service.port }}
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    app: pokevault-mysql
