name: PokéVault AWS Cloud-Native DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  id-token: write # Mandatory for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_PREFIX: pokevault
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  GITOPS_REPO: itsme-aarjav/POKEVAULT-LEGENDS-GITOPS

jobs:
  # 1. Code validation
  validate:
    name: Lint & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Frontend Build Artifacts
        run: npm run build

      - name: Run Microservices Automated Unit Tests
        run: |
          echo "Running auth-service tests..."
          (cd services/auth-service && npm test)
          echo "Running catalog-service tests..."
          (cd services/catalog-service && npm test)
          echo "Running order-service tests..."
          (cd services/order-service && npm test)

  # 2. Build and Trivy security scan
  build-and-security-scan:
    name: Build & Trivy Security Scan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: auth
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - name: catalog
            context: ./services/catalog-service
            dockerfile: ./services/catalog-service/Dockerfile
          - name: order
            context: ./services/order-service
            dockerfile: ./services/order-service/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./services/frontend/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image locally in GitHub Runner for vulnerability scanning
      - name: Build Docker Image for Security Scan
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan image with Trivy
      - name: Run Trivy Vulnerability Scanner (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Enforce strict DevSecOps gate: breaks build immediately on CRITICAL CVEs
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Authenticate to AWS via OIDC
      - name: Configure AWS Credentials via OIDC (No Static Keys)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        if: env.AWS_ROLE_ARN != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push to Amazon ECR
        if: env.AWS_ROLE_ARN != ''
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker tag ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }} $ECR_REGISTRY/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }} $ECR_REGISTRY/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          docker push $ECR_REGISTRY/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest

  # 3. GitOps sync & Automated Image Tag Bump
  gitops-reconcile:
    name: GitOps Sync & Tag Update
    needs: build-and-security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Automated GitOps Image Tag Bump
        run: |
          cd gitops-repo
          echo "Automated GitOps Tag Reconciliation:"
          echo "Target Repository: ${{ env.GITOPS_REPO }}"
          echo "Commit SHA: ${{ github.sha }}"
          python3 -c "
import re
with open('gitops/helm/pokevault/values.yaml', 'r') as f:
    text = f.read()

sha = '${{ github.sha }}'
for svc in ['frontend', 'auth', 'catalog', 'order']:
    pattern = rf'({svc}:(?:.|\n)*?image:(?:.|\n)*?tag:\s*)[^\n]+'
    text = re.sub(pattern, rf'\g<1>{sha}', text)

with open('gitops/helm/pokevault/values.yaml', 'w') as f:
    f.write(text)
"

          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet gitops/helm/pokevault/values.yaml; then
            echo "No GitOps changes to commit."
          else
            git add gitops/helm/pokevault/values.yaml
            git commit -m "chore(gitops): auto-bump image tags to ${{ github.sha }} [skip ci]" || true
            git push origin main || echo "Push skipped or branch protected."
          fi
          echo "ArgoCD reconciliation triggered in ${{ env.GITOPS_REPO }}."
