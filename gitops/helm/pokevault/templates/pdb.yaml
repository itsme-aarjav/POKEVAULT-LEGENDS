# PodDisruptionBudgets for Karpenter node disruption resilience and high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pokevault-frontend-pdb
  namespace: {{ .Values.global.namespace }}
  labels:
    app: pokevault-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pokevault-frontend
---
