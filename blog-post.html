<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/assets/pokeball-favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/pokeball-favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <div id="navbarRoot"></div>

    <div id="blogArticleContainer">
      <!-- Injected dynamically by src/blog-post.js -->
    </div>
  </main>

  <!-- Shared Cart Drawer & Footer -->
  <div id="cartDrawerRoot"></div>
  <div id="footerRoot"></div>

  <script type="module" src="src/blog-post.js"></script>
