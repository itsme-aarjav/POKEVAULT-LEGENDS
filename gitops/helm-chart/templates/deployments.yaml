---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: nginx-gateway
spec:
  replicas: {{ .Values.nginxGateway.replicas }}
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx-gateway
          image: "{{ .Values.awsAccountId }}.dkr.ecr.{{ .Values.awsRegion }}.amazonaws.com/{{ .Values.nginxGateway.image.repository }}:{{ .Values.nginxGateway.image.tag | default .Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.nginxGateway.port }}
              name: http
          env:
            - name: CORS_ORIGIN
              value: "https://{{ .Values.domainName }}"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:5002"
          resources:
            {{- toYaml .Values.nginxGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.nginxGateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.nginxGateway.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
