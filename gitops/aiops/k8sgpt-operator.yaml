# ==============================================================================
# 🤖 K8sGPT AIOps OPERATOR & AUTONOMOUS SRE CUSTOM RESOURCE MANIFEST
# ==============================================================================
# K8sGPT runs as an in-cluster SRE assistant that monitors Kubernetes workloads,
# correlates failure events (CrashLoopBackOff, OOMKilled, ImagePullBackOff, etc.),
# and queries an AI engine (AWS Bedrock, OpenAI, or Local AI) to deliver actionable
# plain-language root-cause diagnoses and exact remediation commands.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: k8sgpt-operator-system
  labels:
    app.kubernetes.io/part-of: pokevault-aiops
---
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: pokevault-aiops-sre
  namespace: k8sgpt-operator-system
spec:
  # AI Backend Engine configuration (Can point to AWS Bedrock, OpenAI, or Local LLM)
  backend: openai
  model: gpt-4o-mini
  noCache: false
  version: v0.3.40
  
  # Secret containing the API key for the AI provider
  secret:
    name: k8sgpt-ai-secret
    key: openai-api-key

  # Namespaces to autonomously monitor and triage
  extraAnalyzeLabels:
    app.kubernetes.io/part-of: pokevault

  # Active AI Analyzers: Deep inspection across all critical Kubernetes primitives
  filters:
    - Pod
    - Deployment
    - StatefulSet
    - ReplicaSet
    - PersistentVolumeClaim
    - Service
    - Ingress
    - HorizontalPodAutoscaler
    - VulnerabilityReport # Correlates with Trivy container security scans!
    - NetworkPolicy

  # Autonomous Sink / Reporting Configuration
  sink:
    type: stdout # Logs AI diagnoses to stdout for Prometheus/FluentBit aggregation
