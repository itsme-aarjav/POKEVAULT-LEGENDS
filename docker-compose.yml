services:
  # ─── 1. DATABASE TIER (MySQL 8.0) ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pokevault-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_super_secret
      MYSQL_DATABASE: pokevault
      MYSQL_USER: pokevault
      MYSQL_PASSWORD: pokevault_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pokevault", "-ppokevault_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pokevault-net

  # ─── 2. APPLICATION RUNTIME TIER (Express & Multi-Page Frontend) ───────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokevault-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
      - HOST=0.0.0.0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=pokevault
      - MYSQL_PASSWORD=pokevault_secret
      - MYSQL_DATABASE=pokevault
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-pokevaultadmin123}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - STOREFRONT_ORIGIN=${STOREFRONT_ORIGIN:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pokevault-net

  # ─── 3. WEB SERVER & REVERSE PROXY TIER (Nginx) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pokevault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on:
      - app
    networks:
      - pokevault-net

volumes:
  mysql_data:
    driver: local

networks:
  pokevault-net:
    driver: bridge
