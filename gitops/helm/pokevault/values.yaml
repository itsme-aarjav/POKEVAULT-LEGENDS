global:
  environment: production
  namespace: pokevault

# Frontend
frontend:
  replicaCount: 2
  image:
    repository: 592668326948.dkr.ecr.us-east-1.amazonaws.com/pokevault-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

# Auth service
auth:
  replicaCount: 2
  image:
    repository: 592668326948.dkr.ecr.us-east-1.amazonaws.com/pokevault-auth
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5001
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

# Catalog service
catalog:
  replicaCount: 2
  image:
    repository: 592668326948.dkr.ecr.us-east-1.amazonaws.com/pokevault-catalog
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5002
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

# Order service
order:
  replicaCount: 2
  image:
    repository: 592668326948.dkr.ecr.us-east-1.amazonaws.com/pokevault-order
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5003
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 128Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

# Redis cache
redis:
  image:
    repository: redis
    tag: 7-alpine
  service:
    type: ClusterIP
    port: 6379
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# MySQL database
mysql:
  image:
    repository: mysql
    tag: "8.0"
  storage:
    size: 10Gi
    storageClass: standard
  service:
    type: ClusterIP
    port: 3306

# Ingress controller
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:592668326948:certificate/e09c64a7-4dec-4310-9bc0-c1dd9a0c4f77
  hosts:
    - paths:
        - path: /
          pathType: Prefix
          service: frontend
