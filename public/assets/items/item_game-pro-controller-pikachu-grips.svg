  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#000000" stroke-width="8" rx="16" />
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="#A78BFA" stroke-width="3" rx="12" opacity="0.8" />

  <g transform="translate(40, 45)">
