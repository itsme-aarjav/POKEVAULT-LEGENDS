version: '3.8'

services:
  # ─── 1. DATABASE (MySQL 8.0) ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pokevault-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_super_secret
      MYSQL_DATABASE: pokevault
      MYSQL_USER: pokevault
      MYSQL_PASSWORD: pokevault_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pokevault", "-ppokevault_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pokevault-net

  # ─── 2. IN-MEMORY CACHE (Redis Alpine) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pokevault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pokevault-net

  # ─── 3. AUTH MICROSERVICE ──────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: pokevault-auth-service
    restart: unless-stopped
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - NODE_ENV=production
      - ADMIN_SECRET_KEY=pokevaultadmin123
    ports:
      - "5001:5001"
    networks:
      - pokevault-net

  # ─── 4. CATALOG MICROSERVICE (High-Read & Redis Cache-Aside) ───────────────
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: pokevault-catalog-service
    restart: unless-stopped
    environment:
      - PORT=5002
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=pokevault
      - MYSQL_PASSWORD=pokevault_secret
      - MYSQL_DATABASE=pokevault
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_SECRET_KEY=pokevaultadmin123
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pokevault-net

  # ─── 5. ORDER & INVENTORY MICROSERVICE (Inter-Service Pricing Calls) ──────
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: pokevault-order-service
    restart: unless-stopped
    environment:
      - PORT=5003
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=pokevault
      - MYSQL_PASSWORD=pokevault_secret
      - MYSQL_DATABASE=pokevault
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - ADMIN_SECRET_KEY=pokevaultadmin123
    ports:
      - "5003:5003"
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - pokevault-net

  # ─── 6. FRONTEND STOREFRONT & REVERSE PROXY GATEWAY (Nginx) ────────────────
  frontend:
    build:
      context: .
      dockerfile: ./services/frontend/Dockerfile
    container_name: pokevault-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - catalog-service
      - order-service
    networks:
      - pokevault-net

volumes:
  mysql_data:
    driver: local

networks:
  pokevault-net:
    driver: bridge
