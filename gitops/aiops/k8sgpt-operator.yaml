# ==============================================================================
# 🤖 K8sGPT AIOps OPERATOR & AUTONOMOUS SRE CUSTOM RESOURCE MANIFEST
# ==============================================================================
# K8sGPT runs as an in-cluster SRE assistant that monitors Kubernetes workloads,
# correlates failure events (CrashLoopBackOff, OOMKilled, ImagePullBackOff, etc.),
# and queries an AI engine to deliver actionable plain-language root-cause
# diagnoses and exact remediation commands.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: k8sgpt-operator-system
  labels:
    app.kubernetes.io/part-of: pokevault-aiops
---
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: pokevault-aiops-sre
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    backend: openai
    model: gpt-4o-mini
    anonymized: true
    secret:
      name: k8sgpt-ai-secret
      key: openai-api-key
  noCache: false
  version: v0.3.40
  filters:
    - Pod
    - Deployment
    - StatefulSet
    - ReplicaSet
    - PersistentVolumeClaim
    - Service
    - Ingress
    - HorizontalPodAutoscaler
