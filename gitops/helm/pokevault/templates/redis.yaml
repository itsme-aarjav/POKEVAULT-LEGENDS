apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokevault-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: pokevault-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokevault-redis
  template:
    metadata:
      labels:
        app: pokevault-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pokevault-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: pokevault-redis
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: pokevault-redis
