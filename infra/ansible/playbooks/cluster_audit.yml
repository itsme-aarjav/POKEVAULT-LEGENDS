---
# ==============================================================================
# 🛠️ ANSIBLE PLAYBOOK: AWS EKS CLUSTER AUDIT & HEALTH VERIFICATION
# ==============================================================================
# Demonstrates enterprise Ansible automation for Kubernetes infrastructure:
# - Validates AWS EKS cluster state & API connectivity
# - Checks node health & Karpenter autoscaling status
# - Audits all microservices pods across pokevault, argocd & monitoring
# - Verifies ALB Ingress endpoint connectivity and HTTP->HTTPS redirection
# ==============================================================================

- name: PokéVault Legends — EKS Infrastructure & Workload Health Audit
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cluster_name: "pokevault-eks-auto"
    aws_region: "us-east-1"
    namespaces:
      - pokevault
      - argocd
      - monitoring
      - k8sgpt-operator-system

  tasks:
    - name: 1. Verify AWS CLI and Kubectl installation
      ansible.builtin.command: "{{ item }} --version"
      register: tool_check
      changed_when: false
      loop:
        - aws
        - kubectl

    - name: Display CLI versions
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ tool_check.results }}"

    - name: 2. Verify EKS Cluster Status on AWS
      ansible.builtin.command: >
        aws eks describe-cluster --name {{ cluster_name }} --region {{ aws_region }} --query "cluster.status" --output text
      register: eks_status
      changed_when: false

    - name: Assert EKS Cluster is ACTIVE
      ansible.builtin.assert:
        that:
          - eks_status.stdout == "ACTIVE"
        fail_msg: "Cluster {{ cluster_name }} is not in ACTIVE state! Current: {{ eks_status.stdout }}"
        success_msg: "Cluster {{ cluster_name }} is ACTIVE and healthy on AWS."

    - name: 3. Audit EKS Auto Mode / Karpenter Worker Nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: node_status
      changed_when: false

    - name: Display Node Pool Status
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"

    - name: 4. Check Pod Status across all Project Namespaces
      ansible.builtin.command: "kubectl get pods -n {{ item }} --no-headers"
      register: pod_status
      changed_when: false
      loop: "{{ namespaces }}"

    - name: Display Pod Status per Namespace
      ansible.builtin.debug:
        msg: "Namespace: {{ item.item }} | Pods:\n{{ item.stdout }}"
      loop: "{{ pod_status.results }}"

    - name: 5. Verify Ingress & Load Balancer Status
      ansible.builtin.command: kubectl get ingress -A --no-headers
      register: ingress_status
      changed_when: false

    - name: Display Active Application Load Balancers
      ansible.builtin.debug:
        msg: "{{ ingress_status.stdout_lines }}"

    - name: 6. Smoke Test PokéVault Storefront HTTPS Endpoint
      ansible.builtin.uri:
        url: "https://k8s-pokevaul-pokevaul-e701e7b82d-2093600175.us-east-1.elb.amazonaws.com/health"
        method: GET
        validate_certs: false
        status_code: 200
        timeout: 10
      register: storefront_health

    - name: Display Storefront Health Status
      ansible.builtin.debug:
        msg: "Storefront Health Response: {{ storefront_health.json }}"

    - name: 7. Audit K8sGPT AIOps Status
      ansible.builtin.command: kubectl get k8sgpt -n k8sgpt-operator-system --no-headers
      register: k8sgpt_status
      changed_when: false

    - name: Display K8sGPT Operator Resource
      ansible.builtin.debug:
        msg: "K8sGPT AIOps Resource: {{ k8sgpt_status.stdout }}"
