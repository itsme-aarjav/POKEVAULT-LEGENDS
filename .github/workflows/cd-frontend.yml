name: Frontend CloudFront CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '*.html'
      - 'styles.css'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "592668326948"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run storefront tests
        run: npm test

      - name: Build static production bundle
        env:
          VITE_API_BASE_URL: https://api.aarjav.site/api
        run: npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/pokevault-github-ci-role
          aws-region: us-east-1

      - name: Deploy to S3 and Invalidate CloudFront
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET="pokevault-frontend-${ACCOUNT_ID}"
          echo "Deploying to s3://${BUCKET}..."

          aws s3 sync dist/ "s3://${BUCKET}" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

          aws s3 sync dist/ "s3://${BUCKET}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, 'aarjav.site')].Id | [0]" --output text)
          if [[ -z "${DIST_ID}" || "${DIST_ID}" == "None" ]]; then
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, 'pokevault-frontend-${ACCOUNT_ID}')].Id | [0]" --output text)
          fi

          echo "CloudFront Distribution ID: ${DIST_ID}"
          if [[ -n "${DIST_ID}" && "${DIST_ID}" != "None" ]]; then
            aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"
            echo "CloudFront invalidation created."
          else
            echo "CloudFront distribution not found. Skipping cache invalidation."
          fi
