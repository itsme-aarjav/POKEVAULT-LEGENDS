apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: pokevault-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pokevault-env-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: pokevault-aws-secrets
    kind: ClusterSecretStore
  target:
    name: pokevault-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pokevault/prod/config
