apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokevault-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/itsme-aarjav/POKEVAULT-LEGENDS.git
    targetRevision: HEAD
    path: gitops/helm-chart
    helm:
      parameters:
        - name: awsAccountId
          value: "592668326948"
        - name: awsRegion
          value: "us-east-1"
        - name: domainName
          value: "aarjav.site"
        - name: acmCertificateArn
          value: "arn:aws:acm:us-east-1:592668326948:certificate/37e215e7-9c39-49e1-bb6c-97ae039dba2e"
        - name: wafAclArn
          value: "arn:aws:wafv2:us-east-1:592668326948:regional/webacl/pokevault-alb-waf/6ebab246-7741-442c-a72e-c60c9daaa259"
        - name: imageTag
          value: "latest"
  destination:
    server: https://kubernetes.default.svc
    namespace: pokevault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
