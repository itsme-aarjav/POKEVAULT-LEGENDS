    <rect x="-3" y="-3" width="520" height="44" fill="url(#goldGrad)" rx="8" stroke="#000" stroke-width="3"/>
    <text x="20" y="27" font-family="'Impact', 'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#000000" letter-spacing="1">
