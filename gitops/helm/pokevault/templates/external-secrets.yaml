apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pokevault-external-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: pokevault
    security.pokevault.io/managed-by: external-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: pokevault-cloud-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: pokevault/production/database
        property: password
    - secretKey: ADMIN_SECRET_KEY
      remoteRef:
        key: pokevault/production/auth
        property: adminKey
