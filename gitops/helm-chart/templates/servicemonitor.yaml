apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pokevault-services-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth-service
          - catalog-service
          - order-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
